name: PBRP build (a7y18lte)

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Make target (pbrp, or recoveryimage, etc.)'
        required: true
        default: 'pbrp'
      build_jobs:
        description: 'Parallelism (-jN)'
        required: true
        default: '4'
      sync_jobs:
        description: 'repo sync parallelism'
        required: true
        default: '4'

# Cancel any in-flight run when a new dispatch comes in
concurrency:
  group: pbrp-a7y18lte-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 720

    steps:
      - name: Show runner
        run: |
          echo "CPU: $(nproc)"
          echo "Mem:  $(free -h)"
          df -h /

      - name: Free disk space on runner
        run: |
          # The default ubuntu-22.04 image ships a lot of things we don't need
          # (dotnet, android sdk, haskell/ghc, hosted toolcache). Drop them
          # to free up ~25-30 GB before we sync the AOSP tree.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache 2>/dev/null || true
          sudo apt-get clean
          sudo apt-get autoremove -y >/dev/null 2>&1 || true
          df -h /

      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev \
            liblz4-tool libncurses5-dev libsdl-dev libssl-dev libxml2 \
            libxml2-utils lzma pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python-is-python3 \
            openjdk-11-jdk-headless

      - name: Install Google repo tool
        run: |
          mkdir -p "$HOME/.bin"
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/.bin/repo"
          chmod a+rx "$HOME/.bin/repo"
          echo "$HOME/.bin" >> "$GITHUB_PATH"

      - name: Configure git identity
        run: |
          git config --global user.email "animegamer4422@gmail.com"
          git config --global user.name "Hari-Pi"
          git config --global --add safe.directory '*'

      - name: Initialize PBRP manifest
        run: |
          mkdir -p Android
          cd Android
          repo init -u https://github.com/PitchBlackRecoveryProject/manifest_pb \
                    -b android-12.1 --depth=1

      - name: Inject a7y18lte local manifest
        run: |
          mkdir -p Android/.repo/local_manifests
          cat > Android/.repo/local_manifests/pb_a7y18lte.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="github" fetch="https://github.com" />
            <project path="device/samsung/a7y18lte"
                     name="Hari-Pi/TWRP_device_samsung_a7y18lte"
                     remote="github"
                     revision="pb-12.1" />
          </manifest>
          XML

      - name: Sync source tree (first pass, allow failures)
        run: |
          cd Android
          repo sync -c -j${{ inputs.sync_jobs }} --no-tags --no-clone-bundle 2>&1 || true

      - name: Sync source tree (retry pass, fail-fast)
        run: |
          cd Android
          repo sync -c -j${{ inputs.sync_jobs }} --no-tags --no-clone-bundle

      - name: Show post-sync disk usage
        run: |
          df -h /
          du -sh Android 2>/dev/null || true
          ls -la Android/device/samsung/a7y18lte/ || true

      - name: Lunch
        run: |
          cd Android
          source build/envsetup.sh
          lunch pb_a7y18lte-eng
          echo "Lunched. TARGET_PRODUCT=$TARGET_PRODUCT TARGET_DEVICE=$TARGET_DEVICE"

      - name: Build PBRP
        run: |
          cd Android
          source build/envsetup.sh
          lunch pb_a7y18lte-eng
          mka ${{ inputs.build_target }} -j${{ inputs.build_jobs }}

      - name: Upload recovery.img
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb_a7y18lte-recovery
          path: Android/out/target/product/a7y18lte/recovery.img
          if-no-files-found: warn
          retention-days: 14

      - name: Upload boot.img (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb_a7y18lte-boot
          path: Android/out/target/product/a7y18lte/boot.img
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build logs (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pb_a7y18lte-logs
          path: |
            Android/out/target/product/a7y18lte/obj/INSTALLED_RECOVERYIMAGE_INTERMEDIATES/*.log
            Android/out/error.log
          if-no-files-found: warn
          retention-days: 30